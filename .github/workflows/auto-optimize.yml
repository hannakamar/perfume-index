name: Autonomous PerfumeIndex Optimizer

on:
  schedule:
    # Runs every 48 hours at 06:00 UTC
    - cron: '0 6 */2 * *'
  workflow_dispatch: # Allows you to click "Run workflow" manually anytime to test

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai google-auth google-api-python-client

      - name: Run Gemini Optimization Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python optimize_agent.py

      - name: Commit and push updated data.json
        run: |
          git config user.name "PerfumeIndex-Agent"
          git config user.email "agent@perfumeindex.local"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(agent): optimize regional SEO & pricing index" && git push)
